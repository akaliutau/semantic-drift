[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selftrap"
version = "0.1.0"
description = "Mechanically verified experiments in predictable model mistakes"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23", "tqdm>=4.66", "python-dotenv>=1.0", "adaption>=0.19,<0.20"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["selftrap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
