[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-gate-audit"
version = "1.0.0"
description = "Paired tests of factual drift in semantic-preservation validation"
requires-python = ">=3.12"
dependencies = ["tqdm>=4.66", "python-dotenv>=1.0", "adaption>=0.19,<0.20", "httpx>=0.28"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
semantic-audit = "pipeline.__main__:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
